<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <!-- Background subtle elements -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F6FA" />
      <stop offset="100%" stop-color="#E5ECF6" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2250A1" />
      <stop offset="100%" stop-color="#1A3E7E" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A03F" />
      <stop offset="100%" stop-color="#C68224" />
    </linearGradient>
    <linearGradient id="boxTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2B75B" />
      <stop offset="100%" stop-color="#E2A03F" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="20" y="20" width="660" height="460" rx="24" fill="url(#bgGrad)" />

  <!-- Floor line and shadow -->
  <ellipse cx="350" cy="420" rx="280" ry="25" fill="#D3DFEE" opacity="0.6" />

  <!-- Warehouse Shelf Structure Left -->
  <rect x="80" y="100" width="16" height="300" rx="3" fill="#64748B" />
  <rect x="220" y="100" width="16" height="300" rx="3" fill="#64748B" />
  <rect x="80" y="170" width="156" height="12" rx="2" fill="#475569" />
  <rect x="80" y="260" width="156" height="12" rx="2" fill="#475569" />
  <rect x="80" y="350" width="156" height="12" rx="2" fill="#475569" />

  <!-- Shelf Boxes -->
  <!-- Top Shelf Box -->
  <rect x="105" y="125" width="48" height="45" rx="3" fill="url(#boxGrad)" />
  <rect x="105" y="125" width="48" height="8" fill="url(#boxTopGrad)" />
  <line x1="129" y1="133" x2="129" y2="170" stroke="#B47218" stroke-width="2" />
  <rect x="160" y="135" width="42" height="35" rx="3" fill="#3B82F6" />
  <rect x="160" y="135" width="42" height="6" fill="#60A5FA" />

  <!-- Mid Shelf Box -->
  <rect x="100" y="205" width="60" height="55" rx="3" fill="url(#boxGrad)" />
  <rect x="100" y="205" width="60" height="10" fill="url(#boxTopGrad)" />
  <line x1="130" y1="215" x2="130" y2="260" stroke="#B47218" stroke-width="2" />
  <rect x="170" y="215" width="40" height="45" rx="3" fill="url(#boxGrad)" />
  <rect x="170" y="215" width="40" height="8" fill="url(#boxTopGrad)" />

  <!-- Bottom Shelf Pallet & Boxes -->
  <rect x="95" y="340" width="125" height="10" fill="#8D6E63" />
  <rect x="105" y="295" width="55" height="45" rx="3" fill="url(#boxGrad)" />
  <rect x="165" y="300" width="48" height="40" rx="3" fill="#38BDF8" />

  <!-- Center Pallet & Stacked Boxes -->
  <!-- Pallet -->
  <rect x="270" y="390" width="180" height="14" rx="2" fill="#8D6E63" />
  <rect x="290" y="404" width="20" height="8" fill="#5D4037" />
  <rect x="350" y="404" width="20" height="8" fill="#5D4037" />
  <rect x="410" y="404" width="20" height="8" fill="#5D4037" />

  <!-- Bottom boxes on center pallet -->
  <rect x="280" y="315" width="75" height="75" rx="4" fill="url(#boxGrad)" />
  <rect x="280" y="315" width="75" height="12" fill="url(#boxTopGrad)" />
  <line x1="317" y1="327" x2="317" y2="390" stroke="#B47218" stroke-width="2" stroke-dasharray="3,3" />
  <rect x="295" y="340" width="20" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />

  <rect x="365" y="305" width="80" height="85" rx="4" fill="url(#boxGrad)" />
  <rect x="365" y="305" width="80" height="14" fill="url(#boxTopGrad)" />
  <line x1="405" y1="319" x2="405" y2="390" stroke="#B47218" stroke-width="2" stroke-dasharray="3,3" />
  <rect x="380" y="335" width="24" height="14" rx="1" fill="#FFFFFF" opacity="0.85" />

  <!-- Top stacked box on center pallet -->
  <rect x="320" y="240" width="70" height="65" rx="4" fill="url(#primaryGrad)" />
  <rect x="320" y="240" width="70" height="10" fill="#3B82F6" />
  <line x1="355" y1="250" x2="355" y2="305" stroke="#1E3A8A" stroke-width="2" />
  <!-- Barcode label -->
  <rect x="335" y="265" width="28" height="16" rx="2" fill="#FFFFFF" />
  <line x1="340" y1="269" x2="340" y2="277" stroke="#1E293B" stroke-width="1.5" />
  <line x1="344" y1="269" x2="344" y2="277" stroke="#1E293B" stroke-width="2.5" />
  <line x1="349" y1="269" x2="349" y2="277" stroke="#1E293B" stroke-width="1" />
  <line x1="353" y1="269" x2="353" y2="277" stroke="#1E293B" stroke-width="2" />
  <line x1="357" y1="269" x2="357" y2="277" stroke="#1E293B" stroke-width="1" />

  <!-- Right: Logistics Worker Checking Inventory with Digital Tablet -->
  <!-- Legs -->
  <rect x="525" y="320" width="18" height="90" rx="6" fill="#1E293B" />
  <rect x="555" y="320" width="18" height="90" rx="6" fill="#334155" />
  <!-- Shoes -->
  <ellipse cx="530" cy="412" rx="14" ry="7" fill="#0F172A" />
  <ellipse cx="566" cy="412" rx="14" ry="7" fill="#0F172A" />

  <!-- Body / Torso / Vest -->
  <rect x="515" y="210" width="65" height="115" rx="12" fill="url(#primaryGrad)" />
  <!-- Hi-Vis Vest Straps -->
  <rect x="522" y="210" width="12" height="115" fill="#EAB308" />
  <rect x="556" y="210" width="12" height="115" fill="#EAB308" />
  <rect x="515" y="275" width="65" height="14" fill="#EAB308" />
  <rect x="515" y="278" width="65" height="6" fill="#F8FAFC" opacity="0.8" />

  <!-- Head & Safety Helmet -->
  <circle cx="548" cy="170" r="22" fill="#FBD38D" />
  <!-- Safety Helmet -->
  <path d="M 522 165 C 522 140, 574 140, 574 165 Z" fill="#EAB308" />
  <rect x="518" y="162" width="60" height="6" rx="2" fill="#CA8A04" />

  <!-- Arms & Tablet -->
  <path d="M 520 225 L 485 260 L 500 270 L 530 245 Z" fill="url(#primaryGrad)" />
  <!-- Tablet Device -->
  <rect x="465" y="240" width="45" height="60" rx="5" fill="#1E293B" transform="rotate(-15 465 240)" />
  <rect x="469" y="244" width="37" height="48" rx="3" fill="#38BDF8" transform="rotate(-15 469 244)" />
  <!-- Checkmark / Data on Tablet -->
  <circle cx="490" cy="265" r="8" fill="#FFFFFF" opacity="0.9" />
  <path d="M 486 265 L 489 268 L 495 261" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Decorative floating UI elements -->
  <!-- Floating Stock Badge -->
  <g transform="translate(480, 75)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <circle cx="22" cy="21" r="10" fill="#22C55E" opacity="0.15" />
    <path d="M 17 21 L 20 24 L 27 17" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="40" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Stock Verified</text>
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Real-time sync</text>
  </g>

  <!-- Floating Delivery Box Mini -->
  <g transform="translate(290, 70)">
    <rect x="0" y="0" width="130" height="40" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <circle cx="20" cy="20" r="10" fill="#0284C7" opacity="0.15" />
    <path d="M 15 16 L 25 16 L 25 24 L 15 24 Z" stroke="#0284C7" stroke-width="1.5" fill="none" />
    <line x1="15" y1="19" x2="25" y2="19" stroke="#0284C7" stroke-width="1.5" />
    <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1E293B">AWMS Live</text>
    <text x="38" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Asset Tracking</text>
  </g>
</svg>
