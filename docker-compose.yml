services:
  postgres:
    image: postgres:16-alpine
    container_name: awms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-awms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-awms}?schema=public
      JWT_SECRET: ${JWT_SECRET:-awms-production-jwt-secret-key-2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin.logistics@alssa.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AlssaAdmin2026!}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
